name: Verification

# No path/base filter: docs/schema and stacked PRs need a terminal required check.
# Main/dev pushes use the same executor on the actual pushed tree; no PR-result reuse.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
      trusted: ${{ steps.select.outputs.trusted }}
      live: ${{ steps.select.outputs.live }}
      live_suites: ${{ steps.select.outputs.live_suites }}
      consumer: ${{ steps.select.outputs.consumer }}
      survey: ${{ steps.select.outputs.survey }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: python3 scripts/ci-verification.py plan --output .git/plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: verification-plan
          path: .git/plan.json
          include-hidden-files: true
          if-no-files-found: error

  tooling:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: python3 scripts/verify.py python --output target/verification-python
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-python
          path: |
            target/verification-python/*/receipt.json
            target/verification-python/*/inventory.json
            target/verification-python/*/events.json
            target/verification-python/*/*.log
          if-no-files-found: error
      - run: python3 scripts/check-test-map.py --discover-tooling target/verification-inventory
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-tooling-inventory
          path: target/verification-inventory/
          if-no-files-found: error
      - run: python3 scripts/check-docs.py README.md docs tests/verification
      - run: cargo build --locked -p empack --target-dir target/verification-tools
      - run: uv run scripts/check-authoring-schema.py target/verification-tools/debug/empack

  lint:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ${{ needs.plan.outputs.trusted == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check-core-boundary.py
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked -p empack-lib --lib --tests --no-default-features -- -D warnings
      - run: cargo check --locked --workspace --all-targets --features telemetry
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features telemetry -- -D warnings

  cross-build:
    needs: [plan, lint]
    if: needs.plan.outputs.native == 'true'
    runs-on: ${{ needs.plan.outputs.trusted == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      # Compilation evidence only; ARM64 execution remains a release obligation.
      - run: cross build --release -p empack --locked --target aarch64-unknown-linux-gnu

  test:
    name: test (${{ matrix.target }})
    needs: [plan, lint]
    if: needs.plan.outputs.native == 'true'
    runs-on: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && needs.plan.outputs.trusted == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || matrix.os }}
    # The standard Linux runner needed ~25m for default alone; the 45m job limit
    # cancelled telemetry. Trusted Linux uses the existing Ubuntu runner pool.
    # Allow both independent graphs on the standard fallback runner as well.
    # Individual suite/process limits remain enforced by the shared executor.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: python scripts/verify.py deterministic --test-features minimal --product-features default --output target/verification/default
      - run: python scripts/verify.py deterministic telemetry --test-features all --product-features telemetry --output target/verification/telemetry
      - run: python scripts/verify.py doctest --test-features minimal --output target/verification/doctest-minimal
      - run: python scripts/verify.py doctest --test-features all --output target/verification/doctest-all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: target/verification/
          if-no-files-found: error
          retention-days: 14

  live:
    needs: [plan, lint]
    if: needs.plan.outputs.live == 'true' && needs.plan.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - name: Run relevant official-service and runtime checks
        env:
          LIVE_SUITES: ${{ needs.plan.outputs.live_suites }}
          EMPACK_KEY_CURSEFORGE: ${{ secrets.EMPACK_KEY_CURSEFORGE }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          suites = json.loads(os.environ["LIVE_SUITES"])
          subprocess.run(["python3", "scripts/verify.py", *suites,
                          "--product-features", "telemetry", "--product-profile", "release"], check=True)
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-live
          path: target/verification/
          if-no-files-found: error
          retention-days: 14

  consumer:
    needs: plan
    if: needs.plan.outputs.consumer == 'true' && needs.plan.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prism-parser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-prism
          path: .git/prism.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  survey:
    needs: plan
    if: needs.plan.outputs.survey == 'true' && needs.plan.outputs.trusted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: python3 scripts/verify.py import-survey --product-features telemetry
      # Rolling observations are separate from the offline pinned corpus.
      - run: python3 scripts/survey-imports.py --profile pr --empack-bin "$GITHUB_WORKSPACE/target/verification-product/telemetry/debug/empack"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-survey
          path: |
            target/verification/
            /tmp/empack-curated-smoke/report.json
            /tmp/empack-survey/report.json
          if-no-files-found: error
          retention-days: 14

  coverage:
    needs: [plan, lint]
    if: needs.plan.outputs.native == 'true'
    runs-on: ${{ needs.plan.outputs.trusted == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
      - run: mise run coverage
        env:
          EMPACK_E2E_STRICT: "1"
      - name: Coverage summary
        run: |
          cargo llvm-cov report --failure-mode all --summary-only | tee coverage-summary.txt
          COV_TOTAL=$(awk '/^TOTAL/ {print $10}' coverage-summary.txt)
          test -n "$COV_TOTAL"
          {
            echo "## Coverage: ${COV_TOTAL}"
            echo ""
            echo "| File | Lines | Coverage |"
            echo "|------|-------|----------|"
            awk '$1 ~ /\.rs$/ && $1 !~ /test\.rs/ {printf "| `%s` | %s/%s | %s |\n", $1, $8-$9, $8, $10}' coverage-summary.txt \
              | sort -t'|' -k4 -n \
              | sed -n '1,30p'
            echo ""
            echo "<details><summary>Full report</summary>"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        if: needs.plan.outputs.trusted == 'true'
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  gate:
    name: verification-gate
    needs: [plan, tooling, lint, test, cross-build, coverage, live, consumer, survey]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/verification-evidence
      - name: Verify selected jobs and exact suite outcomes
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-verification.py gate --artifacts "$RUNNER_TEMP/verification-evidence" --output .git/gate.json
      - name: Summarize admitted and missing evidence
        if: always()
        run: |
          if [ -f .git/gate.md ]; then
            cat .git/gate.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-gate
          path: |
            .git/gate.json
            .git/gate.md
          include-hidden-files: true
          if-no-files-found: error
