[workspace]
resolver = "2"
members = ["crates/empack-core", "crates/empack-lib", "crates/empack", "crates/empack-tests"]

[workspace.package]
authors = ["mannie.exe <mannie@inherent.design>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/inherent-design/empack"
version = "0.0.0-dev"

[workspace.metadata.empack]
release-target = "0.6.0-beta"

[workspace.dependencies]
empack-core = { path = "crates/empack-core" }
empack-lib = { path = "crates/empack-lib", default-features = true }

# External dependencies (versions shared across workspace)
anyhow = "1.0.102"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
caseless = "0.2.2"
unicode-normalization = "0.1"
ignore = { version = "0.4.33", default-features = false }
clap = { version = "4.6.0", features = [
    "derive",
    "env",
    "unicode",
    "wrap_help",
] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
directories = "6.0.0"
dotenvy = "0.15.7"
envy = "0.4.2"
ed25519-dalek = "3.0.0"
indicatif = { version = "0.18.4", features = ["rayon", "improved_unicode"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.2", features = ["json", "gzip", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "1.3.0"
semver = "1"
time = { version = "0.3.47", features = ["parsing"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11"
murmur2 = "0.1" # Murmur2 hash for CurseForge fingerprint API
thiserror = "2.0.21"
toml = "1.0.7"
tokio = { version = "1.50.0", features = ["full"] }
console = "0.16"
tower = "0.5.3"
tower_governor = "0.8.0" # Rate limiting middleware
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "local-time",
    "time",
    "smallvec",
    "parking_lot",
] }
windows-core = "0.100.0"
zip = { version = "8.2", default-features = false, features = ["deflate"] } # Zip create/extract for mrpack and distribution archives
tar = "0.4" # Tar archive creation for .tar.gz distribution fallback
flate2 = "1.1" # Gzip compression paired with tar
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress", "util"] } # 7z archive support; util enables compress_to_path helper
handlebars = "6.4.0"

# Telemetry (optional, behind `telemetry` feature gate)
tracing-chrome = "0.7"
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client"] }

# Dev dependencies
assert_cmd = "2.2"
criterion = "0.8.2"
expectrl = "0.9"
mockito = "1.7.2"
predicates = "3"
tempfile = "3.27.0"

# Platform-specific dependencies
libc = "0.2.183"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Storage_FileSystem",
] }
