[profile.default]
# Don't fail fast locally - let all tests run to see complete picture
fail-fast = false
# Default 100ms is too tight for TempDir cleanup on slower disks/CI runners
leak-timeout = "500ms"

[[profile.default.overrides]]
# Rolling input size is outside the regression fixture contract; bound each attempt.
filter = "binary(=live_import_survey)"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
# Fixed input, fresh isolated acquisition, sync and both reference/bundled exports.
filter = "binary(=live_pinned_import)"
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
# Build and preparation contracts can run slowly on CI; live runtime acquisition
# is selected separately from offline archive creation.
filter = "binary(=cli_build) | binary(=live_server_cli) | binary(=journey_local_exports) | binary(=journey_content_kinds)"
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
# Don't fail fast in CI either to see all failures
fail-fast = false
# Preserve the first failure; scenario retries require a fresh fixture.
retries = 0
