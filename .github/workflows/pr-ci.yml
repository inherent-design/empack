name: PR CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      [
        crates/**,
        scripts/**,
        Cargo.toml,
        Cargo.lock,
        .github/workflows/**,
        mise.toml,
        .config/**,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-core-boundary.py
      - run: cargo check --workspace --all-targets
      - run: cargo clippy -p empack-lib --lib --tests --no-default-features -- -D warnings
      - run: cargo check --workspace --all-targets --features telemetry
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features telemetry -- -D warnings

  cross-build:
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      - run: cross build --release -p empack --locked --target aarch64-unknown-linux-gnu

  test:
    name: test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - run: mise run test
      - run: mise run e2e:strict

  import-smoke:
    name: import-smoke (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run build:bin
      - run: python3 scripts/import-smoke-test.py --profile pr
        if: runner.os != 'Windows'
      - run: python scripts/import-smoke-test.py --profile pr
        if: runner.os == 'Windows'

  coverage:
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: mise run coverage
        env:
          EMPACK_E2E_STRICT: "1"
          EMPACK_RUN_LIVE_TESTS: "1"
      - name: Coverage summary
        run: |
          cargo llvm-cov report --failure-mode all --summary-only | tee coverage-summary.txt
          COV_TOTAL=$(awk '/^TOTAL/ {print $10}' coverage-summary.txt)
          test -n "$COV_TOTAL"
          {
            echo "## Coverage: ${COV_TOTAL}"
            echo ""
            echo "| File | Lines | Coverage |"
            echo "|------|-------|----------|"
            awk '$1 ~ /\.rs$/ && $1 !~ /test\.rs/ {printf "| `%s` | %s/%s | %s |\n", $1, $8-$9, $8, $10}' coverage-summary.txt \
              | sort -t'|' -k4 -n \
              | sed -n '1,30p'
            echo ""
            echo "<details><summary>Full report</summary>"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
