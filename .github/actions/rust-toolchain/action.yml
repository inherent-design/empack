name: Project Rust toolchain
description: Install the repository toolchain and requested job components
inputs:
  components:
    description: Additional comma-separated components
    default: ""
  targets:
    description: Additional comma-separated build targets
    default: ""
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        EXTRA_COMPONENTS: ${{ inputs.components }}
      run: |
        python - <<'PYTHON'
        import os
        import tomllib
        from pathlib import Path
        toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
        components = list(toolchain.get("components", []))
        components.extend(filter(None, os.environ["EXTRA_COMPONENTS"].split(",")))
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print("channel=" + toolchain["channel"], file=output)
            print("components=" + ",".join(dict.fromkeys(components)), file=output)
        PYTHON
    - name: Configure the native Windows compiler environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ steps.pin.outputs.components }}
        targets: ${{ inputs.targets }}
