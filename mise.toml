[tools]
git-cliff = "latest"
# cargo-nextest and cargo-llvm-cov installed via taiki-e/install-action in CI
# or cargo install locally; mise's cargo backend conflicts with dtolnay/rust-toolchain

[env]
CARGO_TERM_COLOR = "always"

# Build

[tasks.build]
alias = ["b", "bd"]
description = "Build workspace"
run = "cargo build --workspace"
run_windows = "cargo build --workspace"

[tasks."build:release"]
alias = "br"
description = "Build workspace (release)"
run = "cargo build --workspace --release"
run_windows = "cargo build --workspace --release"

[tasks."build:bin"]
description = "Build empack binary"
run = "cargo build -p empack"
run_windows = "cargo build -p empack"

# Run

[tasks.run]
alias = ["r", "rd"]
description = "Run empack"
run = "cargo run -p empack --"
run_windows = "cargo run -p empack --"

[tasks."run:release"]
alias = "rr"
description = "Run empack (release)"
run = "cargo run -p empack --release --"
run_windows = "cargo run -p empack --release --"

# Test

[tasks.test]
alias = "t"
description = "Run deterministic workspace, Python and doctest contracts"
run = """
python3 scripts/verify.py python
python3 scripts/check-test-map.py --discover-tooling target/verification-inventory
python3 scripts/verify.py deterministic --test-features minimal --product-features default
python3 scripts/verify.py deterministic telemetry --test-features all --product-features telemetry
cargo test --locked --workspace --all-features --doc
"""
run_windows = [
    'python scripts/verify.py python',
    'python scripts/check-test-map.py --discover-tooling target/verification-inventory',
    'python scripts/verify.py deterministic --test-features minimal --product-features default',
    'python scripts/verify.py deterministic telemetry --test-features all --product-features telemetry',
    'cargo test --locked --workspace --all-features --doc',
]

[tasks."test:map"]
description = "Check CLI, Python and rustdoc discovery against reviewed bindings"
run = "python3 scripts/check-test-map.py --discover-tooling target/verification-inventory"
run_windows = "python scripts/check-test-map.py --discover-tooling target/verification-inventory"

[tasks.e2e]
alias = "e"
description = "Compatibility alias: run offline executable contracts"
run = "python3 scripts/verify.py cli"
run_windows = "python scripts/verify.py cli"

[tasks."e2e:filter"]
alias = "fe"
depends = ["build:bin"]
description = "Run a local exploratory test filter (not a qualification suite)"
usage = 'arg "filter" help="nextest test-name substring"'
run = 'cargo nextest run -p empack-tests -E "test(~{{arg(name="filter")}})"'
run_windows = 'cargo nextest run -p empack-tests -E "test(~{{arg(name="filter")}})"'

[tasks."e2e:strict"]
description = "Explicit live CLI qualification, including rolling imports"
run = "python3 scripts/verify.py cli telemetry live-catalog live-provider server-cli live-assistance import-survey --product-features telemetry --product-profile release"
run_windows = "python scripts/verify.py cli telemetry live-catalog live-provider server-cli live-assistance import-survey --product-features telemetry --product-profile release"

[tasks."test:telemetry"]
description = "Run executable telemetry contracts against a telemetry product"
run = "python3 scripts/verify.py telemetry"
run_windows = "python scripts/verify.py telemetry"

[tasks."test:compatibility"]
description = "Run the dated official-service/runtime selection with retained evidence"
run = "python3 scripts/check-live-compatibility.py"
run_windows = "python scripts/check-live-compatibility.py"

[tasks."test:import:corpus"]
description = "Check pinned import archives and independent expected inventories"
run = "python3 scripts/check-import-corpus.py"
run_windows = "python scripts/check-import-corpus.py"

[tasks."smoke:import:pr"]
depends = ["build:bin"]
description = "Survey the latest platform-selected upstream pack (legacy task alias)"
run = "python3 scripts/survey-imports.py --profile pr"
run_windows = "python scripts/survey-imports.py --profile pr"

[tasks.smoke]
depends = ["build:bin"]
description = "Run deterministic CLI smoke contracts without live providers"
run = "cargo nextest run -p empack-tests --test smoke"
run_windows = "cargo nextest run -p empack-tests --test smoke"

[tasks."smoke:runtime"]
depends = ["build:bin"]
description = "Verify CLI build budgets, official runtime bytes and Java server launchers"
run = [
    "cargo nextest run -p empack-lib --features test-utils --lib --run-ignored ignored-only -E 'test(cli_neoforge_build_all_targets_with_default_resource_budget)'",
    "cargo nextest run -p empack-lib --features test-utils --test runtime_server_smoke --run-ignored ignored-only --test-threads 2",
]
run_windows = [
    'cargo nextest run -p empack-lib --features test-utils --lib --run-ignored ignored-only -E "test(cli_neoforge_build_all_targets_with_default_resource_budget)"',
    'cargo nextest run -p empack-lib --features test-utils --test runtime_server_smoke --run-ignored ignored-only --test-threads 2',
]

[tasks."smoke:catalog"]
description = "Verify official game and loader discovery catalogs"
run = "cargo nextest run -p empack-lib --test runtime_catalog_smoke --run-ignored ignored-only"
run_windows = "cargo nextest run -p empack-lib --test runtime_catalog_smoke --run-ignored ignored-only"

[tasks."smoke:providers"]
description = "Verify official provider identities and exact downloaded bytes"
run = "cargo nextest run -p empack-lib --test provider_catalog_smoke --run-ignored ignored-only --test-threads 2"
run_windows = "cargo nextest run -p empack-lib --test provider_catalog_smoke --run-ignored ignored-only --test-threads 2"

[tasks."smoke:import:adapters"]
description = "Inspect explicit archives with normalized engine adapters"
run = "cargo nextest run -p empack-lib --test import_archive_smoke --run-ignored ignored-only"
run_windows = "cargo nextest run -p empack-lib --test import_archive_smoke --run-ignored ignored-only"

[tasks."smoke:import:content"]
description = "Verify and publish explicit imports in temporary projects"
run = "cargo nextest run -p empack-lib --test import_content_smoke --run-ignored ignored-only"
run_windows = "cargo nextest run -p empack-lib --test import_content_smoke --run-ignored ignored-only"

[tasks."smoke:import:curated"]
depends = ["build:bin"]
description = "Survey the latest curated upstream packs (legacy task alias)"
run = "python3 scripts/survey-imports.py --profile curated"
run_windows = "python scripts/survey-imports.py --profile curated"

# Coverage

[tasks.coverage]
alias = "cov"
description = "Run deterministic instrumented tests and offline CLI contracts"
run = """
cargo llvm-cov clean --workspace
cargo llvm-cov --no-report run -p empack --features telemetry -- version
cargo llvm-cov --no-clean --failure-mode all nextest --workspace --features test-utils,telemetry --lcov --output-path lcov.info
"""
run_windows = [
    'cargo llvm-cov clean --workspace',
    'cargo llvm-cov --no-report run -p empack --features telemetry -- version',
    'cargo llvm-cov --no-clean --failure-mode all nextest --workspace --features test-utils,telemetry --lcov --output-path lcov.info',
]

# Lint

[tasks.check]
alias = "chk"
description = "Run cargo check"
run = "cargo check --workspace --all-targets"
run_windows = "cargo check --workspace --all-targets"

[tasks.clippy]
alias = "lint"
description = "Run cargo clippy"
run = "cargo clippy --workspace --all-targets -- -D warnings"
run_windows = "cargo clippy --workspace --all-targets -- -D warnings"

# Profiling

[tasks.profile]
alias = "p"
description = "Run with Perfetto trace profiling"
run = """
EMPACK_PROFILE=chrome cargo run -p empack --features telemetry -- "$@"
echo "Trace written to trace-*.json; open at https://ui.perfetto.dev"
"""

[tasks."profile:otlp"]
description = "Run with OTLP export (requires collector at localhost:4318)"
run = "EMPACK_PROFILE=otlp cargo run -p empack --features telemetry -- \"$@\""

[tasks."profile:samply"]
depends = ["build:release"]
description = "Run under samply sampling profiler (release build)"
run = "samply record ./target/release/empack \"$@\""

[tasks."profile:all"]
description = "Run with all telemetry layers enabled"
run = "EMPACK_PROFILE=all cargo run -p empack --features telemetry -- \"$@\""

# Maintenance

[tasks.clean]
alias = "c"
description = "Remove build artifacts"
run = "cargo clean"
run_windows = "cargo clean"
