name: Release pack
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: false
env:
  EMPACK_VERSION: __EMPACK_RELEASE_TAG__
  # Empty selects build.default (new projects use reference delivery).
  # Configured profile delivery is preserved. To select outputs, list profile names below, one per line.
  EMPACK_PROFILES: ''
  JAVA_VERSION: '21'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install verified empack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/empack-ci.py install
      - name: Build and publish selected profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/empack-ci.py release
